<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Permis B Online — the cobalt PB badge on a cream study sheet with a dashed road line">
  <defs>
    <radialGradient id="pbSky2" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="60%" stop-color="#F5EEDD"/>
      <stop offset="100%" stop-color="#EBE1CB"/>
    </radialGradient>
    <radialGradient id="pbWarm2" cx="84%" cy="20%" r="46%">
      <stop offset="0%" stop-color="#E85A2C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E85A2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pbCool2" cx="14%" cy="84%" r="50%">
      <stop offset="0%" stop-color="#1F4FD1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1F4FD1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#pbSky2)"/>
  <rect width="1600" height="900" fill="url(#pbWarm2)"/>
  <rect width="1600" height="900" fill="url(#pbCool2)"/>

  <g stroke="#D8CDB4" stroke-width="2" opacity="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="270" x2="1600" y2="270"/>
    <line x1="0" y1="390" x2="1600" y2="390"/>
    <line x1="0" y1="510" x2="1600" y2="510"/>
    <line x1="0" y1="630" x2="1600" y2="630"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>

  <path d="M 90,590 Q 800,680 1510,540" fill="none" stroke="#1F4FD1" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="48 34" opacity="0.30"/>

  <!-- PB badge -->
  <g transform="translate(675,295) rotate(-3 125 125)">
    <rect x="22" y="26" width="230" height="230" rx="54" fill="#1A1714"/>
    <rect x="6"  y="8"  width="230" height="230" rx="54" fill="#1F4FD1"/>
    <rect x="26" y="28" width="190" height="190" rx="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="12"/>
    <text x="121" y="162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-weight="700" font-size="112" letter-spacing="-6" fill="#FFFFFF">PB</text>
  </g>

  <!-- road-sign accents -->
  <g transform="translate(300,238)" opacity="0.9">
    <circle r="34" fill="#1F4FD1" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M0,-15 L13,5 L4,5 L4,16 L-4,16 L-4,5 L-13,5 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(1310,650)" opacity="0.9">
    <path d="M0,-34 L34,26 L-34,26 Z" fill="#FBF6EC" stroke="#C0392B" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-3.4" y="-16" width="7" height="23" rx="3.4" fill="#1A1714"/>
    <circle cx="0" cy="16" r="3.8" fill="#1A1714"/>
  </g>
</svg>
