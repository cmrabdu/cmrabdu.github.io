<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Qalam — a glowing reed pen with a small constellation on an ink-blue night sky">
  <defs>
    <radialGradient id="sky2" cx="50%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#3a2f1a"/>
      <stop offset="48%" stop-color="#2b2416"/>
      <stop offset="100%" stop-color="#1d170d"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d488"/>
      <stop offset="52%" stop-color="#c79a4f"/>
      <stop offset="100%" stop-color="#a9762f"/>
    </linearGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e6c0" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#c79a4f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c79a4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f0d488" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0d488" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky2)"/>
  <circle cx="812" cy="470" r="360" fill="url(#halo2)"/>

  <!-- dust -->
  <g fill="#f4eede">
    <circle cx="140" cy="560" r="2.4" opacity="0.4"/>
    <circle cx="240" cy="720" r="2"   opacity="0.32"/>
    <circle cx="120" cy="360" r="1.8" opacity="0.3"/>
    <circle cx="520" cy="760" r="2"   opacity="0.34"/>
    <circle cx="820" cy="820" r="1.8" opacity="0.3"/>
    <circle cx="1120" cy="770" r="2"   opacity="0.32"/>
    <circle cx="1420" cy="720" r="2.2" opacity="0.36"/>
    <circle cx="1500" cy="470" r="2"   opacity="0.34"/>
    <circle cx="1520" cy="200" r="1.8" opacity="0.32"/>
    <circle cx="1080" cy="90"  r="2"   opacity="0.32"/>
    <circle cx="60"  cy="700" r="1.8" opacity="0.3"/>
    <circle cx="1560" cy="600" r="1.6" opacity="0.3"/>
  </g>

  <!-- constellation arc, riding above the pen -->
  <polyline points="200,320 424,208 700,150 984,152 1244,214 1442,338"
            fill="none" stroke="url(#gold2)" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
  <g>
    <circle cx="700" cy="150" r="34" fill="url(#starGlow2)"/>
    <circle cx="984" cy="152" r="38" fill="url(#starGlow2)"/>
    <circle cx="1244" cy="214" r="26" fill="url(#starGlow2)"/>
    <circle cx="200"  cy="320" r="5"   fill="#f0d488" opacity="0.9"/>
    <circle cx="424"  cy="208" r="5.5" fill="#f4eede"/>
    <circle cx="700"  cy="150" r="8.5" fill="#fff6e2"/>
    <circle cx="984"  cy="152" r="9.5" fill="#fff6e2"/>
    <circle cx="1244" cy="214" r="7"   fill="#f0d488"/>
    <circle cx="1442" cy="338" r="5"   fill="#f4eede" opacity="0.9"/>
  </g>

  <!-- Qalam reed pen, centered and large -->
  <g transform="translate(560,230) scale(21)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f0d488" stroke-width="0.8" opacity="0.5" filter="url(#soft2)">
      <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4"/>
      <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4"/>
    </g>
    <g stroke="url(#gold2)" stroke-width="0.66">
      <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4"/>
      <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4"/>
    </g>
  </g>

  <!-- nib star -->
  <circle cx="644" cy="650" r="17" fill="url(#starGlow2)"/>
  <circle cx="644" cy="650" r="5.5" fill="#fff6e2"/>
</svg>
