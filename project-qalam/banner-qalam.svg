<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Qalam — a glowing reed pen surrounded by a constellation on an ink-blue night sky">
  <defs>
    <radialGradient id="sky" cx="46%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#3a2f1a"/>
      <stop offset="46%" stop-color="#2b2416"/>
      <stop offset="100%" stop-color="#1d170d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d488"/>
      <stop offset="52%" stop-color="#c79a4f"/>
      <stop offset="100%" stop-color="#a9762f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e6c0" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c79a4f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c79a4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f0d488" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0d488" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="1680" height="720" fill="url(#sky)"/>

  <!-- Warm guiding glow behind the pen -->
  <circle cx="838" cy="352" r="300" fill="url(#halo)"/>

  <!-- Faint dust of far stars -->
  <g fill="#f4eede">
    <circle cx="90"  cy="120" r="2"   opacity="0.35"/>
    <circle cx="200" cy="560" r="1.6" opacity="0.3"/>
    <circle cx="150" cy="330" r="2.4" opacity="0.45"/>
    <circle cx="330" cy="90"  r="1.8" opacity="0.4"/>
    <circle cx="450" cy="620" r="2"   opacity="0.3"/>
    <circle cx="560" cy="120" r="1.6" opacity="0.35"/>
    <circle cx="620" cy="470" r="1.6" opacity="0.28"/>
    <circle cx="760" cy="640" r="2.2" opacity="0.35"/>
    <circle cx="880" cy="600" r="1.6" opacity="0.3"/>
    <circle cx="1000" cy="640" r="1.8" opacity="0.32"/>
    <circle cx="1120" cy="560" r="1.6" opacity="0.28"/>
    <circle cx="1300" cy="640" r="2"   opacity="0.34"/>
    <circle cx="1500" cy="620" r="1.6" opacity="0.3"/>
    <circle cx="1580" cy="440" r="2.2" opacity="0.4"/>
    <circle cx="1620" cy="180" r="1.8" opacity="0.36"/>
    <circle cx="1470" cy="110" r="2"   opacity="0.34"/>
    <circle cx="1250" cy="90"  r="1.6" opacity="0.3"/>
    <circle cx="1050" cy="70"  r="1.8" opacity="0.32"/>
    <circle cx="60"   cy="470" r="1.6" opacity="0.3"/>
    <circle cx="1560" cy="300" r="1.6" opacity="0.3"/>
  </g>

  <!-- Constellation: an arc sweeping over the pen, left -> top -> right -> down -->
  <polyline points="150,500 330,388 528,300 742,178 984,158 1210,232 1402,384 1520,556"
            fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.5" stroke-linecap="round"/>

  <!-- Constellation stars -->
  <g>
    <!-- glow halos on the anchor stars -->
    <circle cx="742"  cy="178" r="30" fill="url(#starGlow)"/>
    <circle cx="984"  cy="158" r="34" fill="url(#starGlow)"/>
    <circle cx="1210" cy="232" r="26" fill="url(#starGlow)"/>
    <!-- cores -->
    <circle cx="150"  cy="500" r="4"   fill="#f4eede" opacity="0.85"/>
    <circle cx="330"  cy="388" r="5"   fill="#f0d488"/>
    <circle cx="528"  cy="300" r="4.5" fill="#f4eede"/>
    <circle cx="742"  cy="178" r="7.5" fill="#fff6e2"/>
    <circle cx="984"  cy="158" r="8.5" fill="#fff6e2"/>
    <circle cx="1210" cy="232" r="6.5" fill="#f0d488"/>
    <circle cx="1402" cy="384" r="5"   fill="#f4eede"/>
    <circle cx="1520" cy="556" r="4"   fill="#f0d488" opacity="0.9"/>
  </g>

  <!-- Qalam — the reed pen (tabler feather), large & glowing -->
  <g transform="translate(630,150) scale(17.5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f0d488" stroke-width="0.95" opacity="0.5" filter="url(#soft)">
      <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4"/>
      <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4"/>
    </g>
    <g stroke="url(#gold)" stroke-width="0.8">
      <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4"/>
      <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4"/>
    </g>
  </g>

  <!-- the nib touches its first star -->
  <circle cx="700" cy="500" r="14" fill="url(#starGlow)"/>
  <circle cx="700" cy="500" r="4.5" fill="#fff6e2"/>
</svg>
